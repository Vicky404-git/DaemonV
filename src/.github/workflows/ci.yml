name: CI

on:
  push:
    branches: [ master, feature/* ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: find src -name "*.java" | xargs javac -d out

      - name: Build JAR
        run: jar cfe DaemonV.jar Main -C out .

      - name: Verify JAR
        run: java -jar DaemonV.jar --version
